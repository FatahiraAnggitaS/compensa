name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, dom, fileinfo, filter, iconv, libxml, mbstring, pdo_sqlite, simplexml, xml, xmlreader, xmlwriter, zlib
          coverage: none
          tools: composer:v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force

      - name: Install Python dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Train and validate model artifact
        run: python ml/train.py --dataset data_train/salary_500.csv

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run Laravel tests
        run: php artisan test

      - name: Run Python tests
        run: python -m unittest discover -s ml/tests

      - name: Check Python lint
        run: python -m ruff check ml

      - name: Check Python formatting
        run: python -m ruff format --check ml
